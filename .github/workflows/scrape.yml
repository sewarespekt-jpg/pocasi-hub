name: Scrape kina a zpravy
on:
  schedule:
    - cron: '0 9 * * 3'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
jobs:
  scrape-kina:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '0 9 * * 3'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic
      - name: Run kino scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scrape_kina.py
      - name: Commit kina.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kina.json
          git diff --staged --quiet || git commit -m "Aktualizace kin $(date '+%Y-%m-%d')"
          git push

  scrape-zpravy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '0 12 * * 1-5'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic
      - name: Run zpravy scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scrape_zpravy.py
      - name: Commit zpravy.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zpravy.json
          git diff --staged --quiet || git commit -m "Aktualizace zpravy $(date '+%Y-%m-%d %H:%M')"
          git push
